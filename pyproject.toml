[project]
name = "aimarket-mcp"
version = "0.2.3"
description = "alexar76 ecosystem MCP gateway — SSRF-hardened web fetch/search + Metis verify (stdio + HTTP)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "alexar76", email = "publish@alexar76.dev" }]
keywords = ["mcp", "aimarket", "web-fetch", "web-search", "metis", "stdio"]
dependencies = [
    # <2, not <4. mcp 2.0.0 removed `mcp.server.fastmcp` — the module this server is built
    # on — so the console script died on import for anyone installing after that release,
    # while an existing install with 1.x kept working. The old ceiling was optimism about
    # a major version that had not shipped yet; this one states what is actually tested.
    # Raise it deliberately, after porting to whatever replaces FastMCP in 2.x.
    "mcp>=1.6,<2",
    "httpx>=0.27,<1",
    # >=2.7.2, not >=2: mcp 1.6 itself requires pydantic>=2.7.2, so `>=2` was a promise the
    # resolver could never keep — asking for it produced ResolutionImpossible, not a working
    # install. Both ends of every range below are now tested by scripts/prerelease.py.
    "pydantic>=2.7.2,<3",
    "starlette>=0.37,<2",
    "uvicorn>=0.30,<1",
]

[project.urls]
Homepage = "https://glama.ai/mcp/servers/alexar76/aimarket-mcp"
Repository = "https://github.com/alexar76/aimarket-mcp"
Documentation = "https://github.com/alexar76/aimarket-mcp#readme"
Issues = "https://github.com/alexar76/aimarket-mcp/issues"

[project.scripts]
# Glama runs: mcp-proxy -- aimarket-mcp  → must be stdio (FastMCP), not HTTP.
aimarket-mcp = "mcp_stdio_server:main"
aimarket-mcp-http = "aimarket_mcp.server:main"
aimarket-mcp-stdio = "mcp_stdio_server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aimarket_mcp"]
py-modules = ["mcp_stdio_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
